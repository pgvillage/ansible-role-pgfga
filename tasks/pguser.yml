---
# pgfga logs in over the unix socket as pgfga_pg_user (ident). Create that role as a superuser, as the PostgreSQL OS
# user. On a standby the role comes from the primary, so nothing is created there.
- name: Install psycopg, for the community.postgresql modules
  ansible.builtin.package:
    name: "{{ pgfga_python_packages }}"
    state: present

- name: Check whether PostgreSQL is a standby
  become: true
  become_user: "{{ pgfga_pg_admin_osuser }}"
  community.postgresql.postgresql_query:
    login_unix_socket: "{{ pgfga_pg_host }}"
    login_port: "{{ pgfga_pg_port }}"
    login_db: "{{ pgfga_pg_dbname }}"
    query: select pg_is_in_recovery() as standby
  register: pgfga_pg_recovery
  changed_when: false

- name: Create the PostgreSQL user of pgfga (LOGIN SUPERUSER)
  become: true
  become_user: "{{ pgfga_pg_admin_osuser }}"
  community.postgresql.postgresql_user:
    name: "{{ pgfga_pg_user }}"
    role_attr_flags: LOGIN,SUPERUSER
    login_unix_socket: "{{ pgfga_pg_host }}"
    login_port: "{{ pgfga_pg_port }}"
    login_db: "{{ pgfga_pg_dbname }}"
  when: not pgfga_pg_recovery.query_result[0].standby
