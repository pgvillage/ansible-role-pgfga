---
- name: "Create pgfga_osgroup"
  ansible.builtin.group:
    name: "{{ pgfga_osgroup }}"
    system: "true"
    state: present

- name: "Create pgfga_user"
  ansible.builtin.user:
    name: "{{ pgfga_osuser }}"
    group: "{{ pgfga_osgroup }}"
    create_home: "true"
    system: "true"
    state: present

- name: Get user info for {{ pgfga_osuser }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ pgfga_osuser }}"
    split: ":"

- name: "~/.postgresql dir"
  ansible.builtin.file:
    path: "{{ getent_passwd[pgfga_osuser][4] }}/.postgresql"
    state: directory
    owner: "{{ pgfga_osuser }}"
    group: "{{ pgfga_osgroup }}"
    mode: "0750"

- name: "Deploy certs to ~/.postgresql/"
  ansible.builtin.copy:
    dest: "{{ getent_passwd[pgfga_osuser][4] }}/.postgresql/{{ item.name }}"
    owner: "{{ pgfga_osuser }}"
    group: "{{ pgfga_osgroup }}"
    mode: "{{ item.mode }}"
    content: "{{ item.content }}"
  diff: false
  loop:
    - name: root.crt
      mode: "0640"
      content: "{{ certs.client.postgres }}"
    - name: "postgresql.crt"
      mode: "0640"
      content: "{{ certs.client.pgfga }}"
    - name: "postgresql.key"
      mode: "0600"
      content: "{{ private_keys.client.pgfga }}"
  loop_control:
    label: "{{ item.name }}"
  when: pgfga_cert_managed

- name: Create deploydir and configdir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pgfga_deploydir }}"
    - "{{ pgfga_configdir }}"

- name: Copy rpm
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp"
    mode: "0600"
  loop: "{{ pgfga_local_packages }}"

- name: Install pgfga
  ansible.builtin.package:
    name: "/tmp/{{ item }}"
    state: "{{ pgfga_package_state }}"
  loop: "{{ pgfga_local_packages }}"
  register: pgfga_local_package_installed

- name: Install pgfga
  ansible.builtin.package:
    name: "{{ item }}"
    state: "{{ pgfga_package_state }}"
  loop: "{{ pgfga_packages }}"
  register: pgfga_package_installed

# Older pgvillage packages installed pgfga in /usr/local/bin, newer ones in
# /usr/bin. With `present` an old package stays, and the unit would point to a
# binary that is not there: fail before the unit and config change.
- name: Check that the pgfga binary exists
  ansible.builtin.stat:
    path: "{{ pgfga_deploydir }}/pgfga"
  register: pgfga_binary
  when:
    - pgfga_package_state != 'absent'
    - (pgfga_packages + pgfga_local_packages) | length > 0

- name: Fail when the pgfga binary is missing
  ansible.builtin.fail:
    msg: >-
      {{ pgfga_deploydir }}/pgfga does not exist after installing the pgfga
      packages (state {{ pgfga_package_state }}).
      Older pgvillage packages install pgfga in /usr/local/bin.
      Set pgfga_package_state: latest (once) to move to the new package,
      or set pgfga_deploydir: /usr/local/bin to keep the old build.
  when:
    - pgfga_binary is not skipped
    - not pgfga_binary.stat.exists
    # In check mode a package that is not installed yet has no binary
    - not (ansible_check_mode and (pgfga_package_installed is changed or pgfga_local_package_installed is changed))
