---
- name: Converge
  hosts: all
  vars:
    # The connection (socket, user pgfga, ident) comes from pgfga_default_config
    pgfga_config:
      general:
        loglevel: debug
      databases:
        appdb:
          owner: appowner
      roles:
        app_readers: {}
      users:
        app_user:
          auth: password
          password: app-secret
          memberof:
            - app_readers
  roles:
    - role: pgvillage.pgfga
