---
- name: Verify
  hosts: all
  tasks:
    # pgfga applies its config and exits
    - name: Read the result of the last pgfga run
      ansible.builtin.systemd:
        name: pgfga.service
      register: pgfga_unit

    - name: Check that pgfga ran successfully and is enabled
      ansible.builtin.assert:
        that:
          - pgfga_unit.status.Result == 'success'
          - pgfga_unit.status.ExecMainStatus == '0'
          - pgfga_unit.status.UnitFileState == 'enabled'
        fail_msg: >-
          Result={{ pgfga_unit.status.Result }} ExecMainStatus={{ pgfga_unit.status.ExecMainStatus }}
          UnitFileState={{ pgfga_unit.status.UnitFileState }}

    - name: Read the database, roles and memberships from PostgreSQL
      become: true
      become_user: postgres
      ansible.builtin.command:
        argv:
          - psql
          - -Atc
          - >-
            select 'db ' || datname || ' ' || pg_get_userbyid(datdba) from pg_database where datname = 'appdb'
            union all
            select 'role ' || rolname || ' ' || rolcanlogin
              from pg_roles where rolname in ('app_user', 'app_readers', 'appowner')
            union all
            select 'member ' || r.rolname || ' ' || m.rolname from pg_auth_members am
              join pg_roles r on r.oid = am.roleid join pg_roles m on m.oid = am.member
              where m.rolname = 'app_user'
      register: objects
      changed_when: false

    - name: Check that pgfga created them
      ansible.builtin.assert:
        that:
          - "'db appdb appowner' in objects.stdout_lines"
          - "'role app_user true' in objects.stdout_lines"
          - "'role app_readers false' in objects.stdout_lines"
          - "'member app_readers app_user' in objects.stdout_lines"
        fail_msg: "{{ objects.stdout }}"

    - name: Read the PostgreSQL user of pgfga, created by the role
      become: true
      become_user: postgres
      ansible.builtin.command: psql -Atc "select rolname, rolsuper, rolcanlogin from pg_roles where rolname = 'pgfga'"
      register: pgfga_role
      changed_when: false

    - name: Check that the role created it as a superuser that can log in
      ansible.builtin.assert:
        that: pgfga_role.stdout == 'pgfga|t|t'
        fail_msg: "{{ pgfga_role.stdout }}"

    - name: Read the deployed pgfga configuration
      ansible.builtin.slurp:
        src: /etc/pgfga/config.yaml
      register: pgfga_config_file

    - name: Check that pgfga connects over the socket as pgfga
      ansible.builtin.assert:
        that:
          - dsn.host == '/var/run/postgresql'
          - dsn.port | string == '5432'
          - dsn.user == 'pgfga'
          - dsn.dbname == 'postgres'
        fail_msg: "{{ dsn | to_json }}"
      vars:
        dsn: "{{ (pgfga_config_file.content | b64decode | from_yaml).postgresql_dsn }}"

# An old package installed pgfga in /usr/local/bin, while the unit points to
# pgfga_deploydir (/usr/bin). Simulate that by moving the binary away: the
# install tasks must fail with a clear message.
- name: Verify the failure when the pgfga binary is missing
  hosts: all
  tasks:
    - name: Move the pgfga binary away, as if an old package put it in /usr/local/bin
      ansible.builtin.command: mv /usr/bin/pgfga /usr/local/bin/pgfga
      changed_when: true

    - name: Run the install tasks with the binary missing
      block:
        - name: Run the install tasks of the role
          ansible.builtin.include_role:
            name: pgvillage.pgfga
            tasks_from: install.yml

        - name: The role should have failed
          ansible.builtin.fail:
            msg: The role did not fail on the missing pgfga binary
      rescue:
        - name: Check the failure message
          ansible.builtin.assert:
            that:
              - "'/usr/bin/pgfga does not exist' in ansible_failed_result.msg"
              - "'pgfga_package_state: latest' in ansible_failed_result.msg"
            fail_msg: "{{ ansible_failed_result.msg }}"
      always:
        - name: Put the pgfga binary back
          ansible.builtin.command: mv /usr/local/bin/pgfga /usr/bin/pgfga
          changed_when: true
