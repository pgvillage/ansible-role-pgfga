---
# pgfga manages users, roles and databases in PostgreSQL, as a superuser. The
# smallest real setup is the PostgreSQL server from the distribution. The role
# creates the pgfga superuser, which the pgfga OS user logs in as (peer).
- name: Prepare
  hosts: all
  vars:
    pgvillage_repo: https://repo.pgvillage.org/yum/v0.3.8
  tasks:
    - name: Add the pgvillage package repo, so the role installs pgfga by name
      ansible.builtin.yum_repository:
        name: pgvillage
        description: pgvillage packages
        baseurl: "{{ pgvillage_repo }}/el$releasever/$basearch/"
        gpgcheck: true
        gpgkey: https://repo.pgvillage.org/yum/pgvillage.asc

    - name: Install the PostgreSQL server
      ansible.builtin.dnf:
        name: postgresql-server
        state: present

    - name: Initialize the PostgreSQL data directory
      ansible.builtin.command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION

    - name: Start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true
