---
# pgfga manages users, roles and databases in PostgreSQL, as a superuser. The
# smallest real setup is the PostgreSQL server from the distribution, with a
# pgfga superuser that the pgfga OS user logs in as with peer authentication.
- name: Prepare
  hosts: all
  vars:
    pgvillage_repo: https://repo.pgvillage.org/yum/v0.3.8
  tasks:
    - name: Add the pgvillage package repo, so the role installs pgfga by name
      ansible.builtin.yum_repository:
        name: pgvillage
        description: pgvillage packages
        baseurl: "{{ pgvillage_repo }}/el$releasever/$basearch/"
        gpgcheck: true
        gpgkey: https://repo.pgvillage.org/yum/pgvillage.asc

    - name: Install the PostgreSQL server
      ansible.builtin.dnf:
        name: postgresql-server
        state: present

    - name: Initialize the PostgreSQL data directory
      ansible.builtin.command: postgresql-setup --initdb
      args:
        creates: /var/lib/pgsql/data/PG_VERSION

    # pgfga stores passwords as md5 hashes, so password logins over TCP use md5
    - name: Allow peer logins locally, and md5 password logins on localhost
      ansible.builtin.copy:
        dest: /var/lib/pgsql/data/pg_hba.conf
        content: |
          local all all peer
          host all all 127.0.0.1/32 md5
        owner: postgres
        group: postgres
        mode: "0600"

    - name: Start PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Create the pgfga superuser
      become: true
      become_user: postgres
      ansible.builtin.command: psql -c "create role pgfga login superuser"
      register: create_role
      changed_when: create_role.rc == 0
      failed_when: create_role.rc != 0 and 'already exists' not in create_role.stderr
